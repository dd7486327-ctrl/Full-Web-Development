<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
   
</head>
<body>
   <h2>Student Form:</h2> 
   <form> 
     <fieldset style="background-color: hotpink;">
    <div>
    <label for="name"><b>Full Name:</b></label>
    <input type="text" id="Full Name"  placeholder="Enter Your Name"
    required></div><br> <br>
    <div>
    <label for="phone"><b>Phone.No:</b></label>
    <input type="number" id="Phone.No" placeholder="977XXXXXXX" required>
 </div><br><br>
 <div>

<label for="email"><b>Email:</b></label>
<input type="email" id="email" placeholder="Enter Your Email" required>
</div><br><br>
<label><b>Gender:</b></label> <br>
<label for="gender">Male:</label>
<input type="radio" name="gender" value="mail" required>
<label for="gender">Female:</label>
<input type="radio" name="gender" value="femal" required>
<label for="gender">Other:</label>
<input type="radio" name="gender" value="other" required>

<div><br><br>
<label for="comment">Comment</label>
<textarea id="Comment" rows="10" width="1000" placeholder="Write your comment..........."></textarea></div>
<br><br>
<button type="submit" style="background-color: blue;">Submit</button>
</fieldset>
   </form>
   <link rel="stylesheet" href="index.html">
</body>
</html>
